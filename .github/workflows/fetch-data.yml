# Mr News robot: every 6 hours read Google Trends Thailand; once a day in the Thai evening (19:00-23:59) read
# YouTube Thailand + Laos with Win's key; once a week the "most followed" lists and the lesson videos; then rebuild
# the data files the pages show and commit them. GitHub may start scheduled runs late (often 1-3 hours) - fine here.
name: Fetch data

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC = 07:17, 13:17, 19:17, 01:17 Thai time
    - cron: "47 14 * * *"    # 21:47 Thai time: backup for the evening YouTube read if 12:17 UTC was dropped
  workflow_dispatch:
    inputs:
      force:
        description: "Run these now even if not due (youtube,learn,famous) - uses YouTube quota"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-data.yml"
      - "scripts/**"
      - "config/**"

permissions:
  contents: write            # needed to commit the data files

concurrency:
  group: fetch-data          # never two runs at the same time
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # pinned to exact commits (release v4.4.0 of each), same as the Lao Kip project
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Fetch all sources and build
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/fetch-all.mjs

      - name: Check data files
        run: node scripts/check-data.mjs

      # commit only when a data file really changed; "always()" keeps what was fetched even if the check failed
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes - nothing to commit."
            exit 0
          fi
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
